name: Find flight deals

on:
  schedule:
    # 4 times a day. UTC time (Madrid is +1 h in winter, +2 h in summer)
    - cron: "23 5,10,15,20 * * *"
  workflow_dispatch: {}   # "Run workflow" button to start it by hand

permissions:
  contents: write         # to save data/state.json (price history and sent alerts)

concurrency:
  group: vuelos
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search flights and send alerts
        run: python -m vuelos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Save price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "Update price history" && git push)
