name: Buscar chollos de vuelos

on:
  schedule:
    # 4 veces al día. Hora UTC (en Madrid suma 1 h en invierno, 2 h en verano)
    - cron: "23 5,10,15,20 * * *"
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write         # para guardar data/state.json (historial y avisos enviados)

concurrency:
  group: vuelos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar vuelos y avisar
        run: python -m vuelos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Guardar historial de precios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "Actualizar historial de precios" && git push)
