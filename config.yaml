# ─────────────────────────────────────────────────────────────
#  Flight deal finder settings. Edit here and commit.
#  All prices are RETURN, PER PERSON, in euros.
# ─────────────────────────────────────────────────────────────

# How many weeks ahead to look
weeks_ahead: 16

# Weekends we search: [departure day, return day]
# 0=Monday 1=Tuesday 2=Wednesday 3=Thursday 4=Friday 5=Saturday 6=Sunday
weekend_patterns:
  - [4, 6]   # Friday   -> Sunday
  - [4, 0]   # Friday   -> Monday
  - [5, 6]   # Saturday -> Sunday
  - [5, 0]   # Saturday -> Monday

# Weekends one of you can't make it: any trip touching these dates is skipped.
# Add or remove lines freely (format YYYY-MM-DD).
blocked_dates:
  - { from: 2026-10-16, to: 2026-10-18, who: Titou }
  - { from: 2026-10-23, to: 2026-10-25, who: Titou }
  - { from: 2026-11-06, to: 2026-11-08, who: Clau }

# Names used in the Telegram messages
people:
  madrid: Clau
  paris: Titou

# Airports banned on ANY route (neither departing nor landing)
#   BVA = Paris-Beauvais, XCR = Paris-Vatry (both very far from Paris)
banned_airports: [BVA, XCR]

# Paris airports that are fine
paris_airports: [CDG, ORY]

# ── Visits between Spain and Paris ──
visit:
  max_price: 150                     # limit per person, return
  # You go to Paris: only from Madrid
  to_paris_from: [MAD]
  # He comes from Paris: to Madrid, or to cities you can reach by train
  from_paris_to: [MAD, VLC, ZAZ, BCN]   # Madrid, Valencia, Zaragoza, Barcelona
  # Routes Google Flights ALWAYS checks, weekend by weekend
  # (on top of whatever the Travelpayouts radar finds)
  google_scan_airports: [MAD]
  google_weeks_ahead: 8

# ── Meetups: both of you fly somewhere else ──
meetup:
  spain_airports: [MAD]              # where you fly from
  # Limit for the SUM of both tickets (yours + his)
  default_max_total: 200
  destinations:
    - { name: Marseille, city: MRS, airports: [MRS] }
    # paris_by_train: Titou takes the train, so only the Madrid flight is watched (max_price = that ticket)
    - { name: Amsterdam, city: AMS, airports: [AMS], paris_by_train: true, max_price: 220 }
    - { name: Nice,      city: NCE, airports: [NCE] }
    - { name: Lisbon,    city: LIS, airports: [LIS] }
    - { name: Porto,     city: OPO, airports: [OPO] }
    - { name: Bilbao,    city: BIO, airports: [BIO] }
    - { name: Rome,      city: ROM, airports: [FCO, CIA] }
    - { name: Milan,     city: MIL, airports: [MXP, LIN, BGY] }
    - { name: Naples,    city: NAP, airports: [NAP] }
    - { name: Venice,    city: VCE, airports: [VCE, TSF] }
    - { name: Florence,  city: FLR, airports: [FLR] }
    - { name: Bologna,   city: BLQ, airports: [BLQ] }
    - { name: Brussels,  city: BRU, airports: [BRU] }   # no Charleroi (CRL)
    # Example of a custom limit for one destination:
    # - { name: London, city: LON, airports: [LHR, LGW], max_total: 180 }

# ── Price sources ──
providers:
  travelpayouts:            # radar: covers everything, free, cached prices
    enabled: true
    tolerance: 0.15         # re-check on Google prices up to 15 % above the limit
  google:                   # Google Flights (fast-flights): live prices, free
    enabled: true
    delay_seconds: 2.5      # pause between searches so we don't bother Google
    max_verifications: 40   # candidate checks per run
  serpapi:                  # plan B if Google blocks us
    enabled: true
    monthly_limit: 200      # the free plan gives ~250/month; we keep a margin

# ── Alerts ──
alerts:
  realert_drop: 0.10        # alert again about the same trip if it drops another 10 %
  hot_vs_median: 0.75       # 🔥 if it is 25 % below the usual price
  max_per_message: 15
